# Variante con MySQL 8.4 de deploy/compose.lab.yaml (mismas reglas; ver plantillas/compose.lab.yaml).

services:
  api:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
      LOG_FORMAT: json
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 192M

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # MySQL reserva mucha memoria por defecto; estos parámetros lo dejan dentro de 256 MB.
    command: ["--performance-schema=OFF", "--innodb-buffer-pool-size=48M", "--innodb-log-buffer-size=4M",
              "--max-connections=30", "--table-open-cache=256", "--tmp-table-size=8M",
              "--max-heap-table-size=8M", "--skip-name-resolve"]
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

volumes:
  mysqldata:
