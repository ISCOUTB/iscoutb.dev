<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plataforma ISCOUTB</title>
<link rel="icon" href="/marca/favicon.svg">
<style>
  :root { --azul: #0b3d91; --fondo: #f5f7fb; --texto: #14213d; }
  @media (prefers-color-scheme: dark) { :root { --azul: #5b8def; --fondo: #0e1424; --texto: #e8ecf5; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 0 16px;
         background: var(--fondo); color: var(--texto); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 34rem; text-align: center; }
  h1 { margin: 0 0 .25rem; font-size: 2.2rem; color: var(--azul); }
  .uni { margin: 0 0 1.5rem; font-weight: 600; opacity: .8; }
  a.boton { display: inline-block; margin-top: 1.5rem; padding: .75rem 2rem; border-radius: 8px;
            background: var(--azul); color: #fff; font-weight: 600; text-decoration: none; }
  a.boton:hover { opacity: .9; }
  small { display: block; margin-top: 2rem; opacity: .65; }
</style>
</head>
<body>
<main>
  <h1>Plataforma ISCOUTB</h1>
  <p class="uni">Universidad Tecnológica de Bolívar · Ingeniería de Sistemas y Computación</p>
  <p>Plataforma de despliegue de los proyectos del programa. Ingresa al panel con tu correo institucional
     <strong>@utb.edu.co</strong>.</p>
  <a class="boton" href="https://panel.iscoutb.dev">Ingresar al panel</a>
  <small>¿Problemas para entrar? Contacta a tu docente.</small>
</main>
</body>
</html>
