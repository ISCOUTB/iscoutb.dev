# Proxy de marca para el panel: reenvía todo a Dokploy y solo reescribe el <head> del HTML.
map $http_upgrade $conexion { default upgrade; '' close; }

server {
  listen 80 default_server;
  resolver 127.0.0.11 valid=10s;

  location / {
    set $dokploy http://dokploy:3000;
    proxy_pass $dokploy;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $conexion;
    proxy_read_timeout 3600s;
    proxy_buffering off;

    # sub_filter necesita el HTML sin comprimir
    proxy_set_header Accept-Encoding "";
    sub_filter_once on;
    sub_filter '<title>Dokploy</title>' '<title>Plataforma ISCOUTB</title>';
    sub_filter '</head>' '<link rel="icon" href="/marca/favicon.svg"/><link rel="stylesheet" href="/marca/marca.css"/><script src="/marca/marca.js" defer></script></head>';
  }

  location /marca/ {
    alias /usr/share/marca/;
    add_header Cache-Control "public, max-age=300";
  }
}

# Página de inicio pública: www.iscoutb.dev (iscoutb.dev redirige aquí desde Traefik)
server {
  listen 80;
  server_name www.iscoutb.dev;
  root /usr/share/www;
  index index.html;
  location /marca/ { alias /usr/share/marca/; }
  location / { try_files /index.html =404; }
}
