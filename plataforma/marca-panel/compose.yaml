# Proxy de marca del panel (ver nginx.conf). Se levanta con:
#   docker compose -f plataforma/marca-panel/compose.yaml up -d
# y se activa con la ruta de Traefik zz-marca-panel.yml (copiarla a /etc/dokploy/traefik/dynamic/).
services:
  marca-panel:
    image: nginx:1.27-alpine
    container_name: marca-panel
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./marca.css:/usr/share/marca/marca.css:ro
      - ./marca.js:/usr/share/marca/marca.js:ro
      - ./favicon.svg:/usr/share/marca/favicon.svg:ro
    networks: [dokploy-network]
    mem_limit: 64m
    cpus: 0.25
networks:
  dokploy-network:
    external: true
