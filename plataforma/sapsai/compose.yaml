# SAPSAI (github.com/VerbaNexAI/sapsai) adaptado al servidor del laboratorio.
#
# Se construye desde el repositorio (contexto git, sin modificarlo). Diferencias con docker-compose.prod.yml:
#   - sin "ports:" ni "container_name": el tráfico público entra por Traefik (https://sapsai.<dominio>);
#   - sin certbot ni nginx con TLS: el frontend arranca con nginx.temp.conf (HTTP) porque no hay certificado
#     local, y Traefik termina el HTTPS con el certificado wildcard;
#   - sin env_file ni bind mounts: las variables vienen de Dokploy → Environment y los datos van en volúmenes;
#   - límites de CPU y memoria en cada servicio.
# Variables: ver scripts/15-desplegar-sapsai.py (DB_*, secretos JWT/sesión, R2_*, GOOGLE_*, EMAIL_*, SAPSAI_REF).

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    command: ["postgres", "-c", "shared_buffers=48MB", "-c", "effective_cache_size=128MB",
              "-c", "work_mem=4MB", "-c", "maintenance_work_mem=32MB", "-c", "max_connections=40"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 192M

  backend:
    build:
      context: https://github.com/VerbaNexAI/sapsai.git#${SAPSAI_REF:-main}:backend
      # Igual que backend/Dockerfile.prod pero sin --frozen-lockfile: bun.lock del repositorio está
      # desactualizado respecto a package.json y con esa opción el build aborta.
      dockerfile_inline: |
        FROM oven/bun:1-slim AS builder
        WORKDIR /usr/src/app
        RUN apt-get update -y && apt-get install -y --no-install-recommends openssl && rm -rf /var/lib/apt/lists/*
        COPY package.json bun.lock ./
        RUN bun install
        COPY prisma ./prisma
        RUN bunx prisma generate
        COPY . .
        RUN bun run build

        FROM oven/bun:1-slim
        WORKDIR /usr/src/app
        RUN apt-get update -y && apt-get install -y --no-install-recommends openssl && rm -rf /var/lib/apt/lists/*
        COPY package.json ./
        COPY --from=builder /usr/src/app/node_modules ./node_modules
        COPY --from=builder /usr/src/app/dist ./dist
        COPY --from=builder /usr/src/app/prisma ./prisma
        ENV NODE_ENV=production
        EXPOSE 5000
        CMD bunx prisma generate && bunx prisma migrate deploy && bun run start
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: "5000"
      DATABASE_URL: postgresql://${DB_USERNAME}:${DB_PASSWORD}@db:5432/${DB_NAME}
      CLASSIFY_SERVICE_URL: http://classifier:8000/
      FRONTEND_URL: https://sapsai.${DOMINIO:-iscoutb.dev}
      GOOGLE_CALLBACK_URL: https://sapsai.${DOMINIO:-iscoutb.dev}/api/v1/auth/google/callback
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      SESSION_SECRET: ${SESSION_SECRET}
      DEFAULT_EMAIL: ${DEFAULT_EMAIL}
      DEFAULT_USERNAME: ${DEFAULT_USERNAME}
      DEFAULT_PASSWORD: ${DEFAULT_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN:-}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-465}
      EMAIL_SECURE: ${EMAIL_SECURE:-true}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-SAPSAI}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL}
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  classifier:
    build:
      context: https://github.com/VerbaNexAI/sapsai.git#${SAPSAI_REF:-main}:classifier
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL}
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 2G

  frontend:
    build:
      context: https://github.com/VerbaNexAI/sapsai.git#${SAPSAI_REF:-main}:frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api/v1
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      DOMAIN: sapsai.${DOMINIO:-iscoutb.dev}
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

volumes:
  pgdata:
