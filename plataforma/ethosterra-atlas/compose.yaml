# EthosTerra-Atlas (github.com/ISCOUTB/EthosTerra-Atlas) adaptado al servidor del laboratorio.
#
# El compose del repositorio es de desarrollo (Docker Model Runner, servicio de pruebas Playwright, puertos
# publicados en el host) y su Dockerfile de la API no construye (usa Python 3.11 y el proyecto exige >=3.12;
# además la API importa el paquete apps.atlas, que queda fuera de su contexto). Cada servicio se construye
# desde el contexto git con el Dockerfile definido en línea, sin modificar el repositorio:
#   - api: FastAPI (puerto 8000) con el repositorio completo en /app (las rutas de apps.atlas son relativas a la raíz);
#   - ui:  Vite/React compilado y servido con nginx; VITE_API_URL se incorpora al compilar y la URL fija
#          http://localhost:8000/v2 de DocumentPipelineView se sustituye por la pública.
#   - ollama: modelo local Gemma 2 2B (gemma2:2b, ~1,6 GB en disco, ~2 GB en RAM mientras está cargado). Al
#             iniciar descarga el modelo si falta (volumen "modelos", solo la primera vez) y la API lo usa por
#             la API compatible con OpenAI (http://ollama:11434/v1). Se descarga de la memoria tras 5 min sin uso.
#             La API no espera a ollama: mientras el modelo se descarga, las funciones con LLM responden error.
# Sin "ports:" ni "container_name": el tráfico público entra por Traefik (dominios en Dokploy).
# Variables (Dokploy → Environment): DOMINIO, ATLAS_REF.

services:
  api:
    build:
      context: https://github.com/ISCOUTB/EthosTerra-Atlas.git#${ATLAS_REF:-master}
      dockerfile_inline: |
        FROM python:3.12-slim
        ENV PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1 PYTHONPATH=/app:/app/apps/api
        RUN apt-get update -y && apt-get install -y --no-install-recommends curl poppler-utils && rm -rf /var/lib/apt/lists/*
        RUN pip install --no-cache-dir fastapi httpx pydantic pydantic-settings uvicorn pyyaml jsonschema
        WORKDIR /app
        COPY . .
        EXPOSE 8000
        CMD ["uvicorn", "--app-dir", "apps/api", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    environment:
      MODEL_PROVIDER: dmr
      MODEL_BASE_URL: http://ollama:11434/v1
      MODEL_NAME: gemma2:2b
    expose:
      - "8000"
    volumes:
      - datos:/app/outputs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 320M

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull gemma2:2b
        wait
    environment:
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    expose:
      - "11434"
    volumes:
      - modelos:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q gemma2:2b"]
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "3.00"
          memory: 3G

  ui:
    build:
      context: https://github.com/ISCOUTB/EthosTerra-Atlas.git#${ATLAS_REF:-master}:apps/ui
      args:
        VITE_API_URL: https://api-atlas.${DOMINIO:-iscoutb.dev}/v2
      dockerfile_inline: |
        FROM node:20-alpine AS builder
        WORKDIR /app
        COPY package.json ./
        RUN npm install --no-audit --no-fund
        COPY . .
        ARG VITE_API_URL
        ENV VITE_API_URL=$${VITE_API_URL}
        RUN grep -rl "http://localhost:8000/v2" src | xargs -r sed -i "s|http://localhost:8000/v2|$${VITE_API_URL}|g"
        RUN npm run build
        FROM nginx:alpine
        COPY --from=builder /app/dist /usr/share/nginx/html
        RUN printf 'server { listen 80; location / { root /usr/share/nginx/html; index index.html; try_files $$uri $$uri/ /index.html; } }\n' > /etc/nginx/conf.d/default.conf
        EXPOSE 80
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

volumes:
  datos:
  modelos:
